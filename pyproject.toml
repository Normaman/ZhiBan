[tool.uv.workspace]
members = ["services/agent-service"]

[tool.pytest.ini_options]
testpaths = ["services/agent-service/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".runtime", "node_modules", "target"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"evals/run.py" = ["E402"]
"scripts/copilot_contracts.py" = ["E402"]
