server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_http core-service:8080;
    set $core_desktop core-service:6080;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pddpic.com https://*.pddpic.com https://pinduoduo.com https://*.pinduoduo.com https://yangkeduo.com https://*.yangkeduo.com; connect-src 'self'; frame-ancestors 'none'" always;
    location ~ ^/api/v1/admin/shops/[^/]+/knowledge/migration(/preview)?$ {
        proxy_pass http://$core_http;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 100s;
        client_max_body_size 20m;
    }
    location /api/ {
        proxy_pass http://$core_http;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 100s;
        client_max_body_size 2m;
    }
    location /login-desktop/ {
        rewrite ^/login-desktop(/.*)$ $1 break;
        proxy_pass http://$core_desktop;
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /websockify {
        proxy_pass http://$core_desktop/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
