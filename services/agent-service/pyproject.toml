[project]
name = "pdd-copilot-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "prometheus-client>=0.21,<1", "pydantic>=2.10,<3",
  "pypdf>=6,<7", "python-docx>=1.2,<2", "openpyxl>=3.1.5,<4", "defusedxml>=0.7,<1"
]

[project.optional-dependencies]
rag = ["sentence-transformers>=5.7,<6", "psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"copilot.knowledge" = ["*.sql"]
